<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exhibition Hall Booth Selector v2</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  html, body, #root { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f3f4f6; color: #111827; }
  .booth-rect { cursor: pointer; transition: stroke-width 120ms; }
  .booth-rect:hover { stroke-width: 3; }
  .booth-label { font-size: 11px; font-weight: 600; pointer-events: none; user-select: none; }
  .resize-handle { fill: white; stroke: #2563eb; stroke-width: 1.5; cursor: nwse-resize; }
  .scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  .region-overlay { fill: rgba(37, 99, 235, 0.18); stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6,3; }
  /* Pending-selection booth highlight (pulsing bright outline) */
  @keyframes boothPulse {
    0%   { stroke-opacity: 1;   stroke-width: 4; }
    50%  { stroke-opacity: 0.4; stroke-width: 6; }
    100% { stroke-opacity: 1;   stroke-width: 4; }
  }
  .booth-pending-primary { stroke: #ec4899; animation: boothPulse 1.1s ease-in-out infinite; }
  .booth-pending-partner { stroke: #f472b6; animation: boothPulse 1.1s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
